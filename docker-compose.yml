# Local development database. Credentials match appsettings.Development.json.
#   docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: jochat-postgres
    environment:
      POSTGRES_DB: jochat
      POSTGRES_USER: jochat
      POSTGRES_PASSWORD: jochat
    ports:
      - "5432:5432"
    volumes:
      - jochat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jochat -d jochat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jochat-postgres:
