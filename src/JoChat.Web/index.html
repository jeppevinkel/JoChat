<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111520" media="(prefers-color-scheme: dark)" />
    <title>JoChat</title>
    <meta name="description" content="JoChat is a self-hosted chat app for Claude. Build personas, generate images, hear replies read aloud with text-to-speech, and share conversations by link." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JoChat" />
    <meta property="og:title" content="JoChat" />
    <meta property="og:description" content="Self-hosted chat for Claude with custom personas, image generation, text-to-speech and shareable conversations." />
    <!-- Crawlers want absolute URLs; the API rewrites these and adds og:url when it serves the page. -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JoChat logo: an amber tile with a serif J" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JoChat" />
    <meta name="twitter:description" content="Self-hosted chat for Claude with custom personas, image generation, text-to-speech and shareable conversations." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
